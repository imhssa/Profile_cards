<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="image/png" sizes="16x16" rel="icon" href="assets/icon2.png">
    <link
     href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
     rel="stylesheet"/>
     <link rel="stylesheet" href="style.css">
    <title>Profile card | Mahsa Rastgoo</title>
</head>
<body>
    <!-- card 1-->
     <div class="card dark">
        <div class="header">
            <span><i class="ri-arrow-left-line"></i></span>
            <span>
                <i class="ri-poker-hearts-line"></i>
                <i class="ri-more-2-fill"></i>
            </span>
        </div>
        <img src="assets/1.png" alt="user">
        <h1 class="name">Allan Collins</h1>
        <p class="designation">SENIOR FASHION DESIGNER</p>
        <p class="about">Create usable interface and designs @GraficSpark</p>
        <button>Hire Me</button>
        <div class="social__icons">
            <div class="icon__card">
                <div class="icon">
                    <i class="ri-dribbble-line"></i>
                </div>
                <h4>12.8k</h4>
                <p>Followers</p>
            </div>
            <div class="icon__card">
                <div class="icon">
                    <i class="ri-behance-fill"></i>
                </div>
                <h4>10.5k</h4>
                <p>Followers</p>
            </div>
            <div class="icon__card">
                <div class="icon">
                    <i class="ri-pinterest-fill"></i>
                </div>
                <h4>8.2k</h4>
                <p>Followers</p>
            </div>
        </div>
     </div>
