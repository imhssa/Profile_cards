<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/icon3.png">
     <link
     href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
     rel="stylesheet"/>
     <link rel="stylesheet" href="style.css">
    <title>Profile card | Mahsa Rastgoo</title>
</head>
<body>
    <div class="profile__card">
        <div class="header">
            <img src="assets/2.png" alt="profile">
            <button class="follow__btn">FOLLOW</button>
        </div>
        <div class="content">
            <div class="content__left">
                <h1>John Watson</h1>
                <p>@DrWatson</p>
                <hr>
                <div class="media">
                    <div class="followers">
                        <span class="count">22.6k</span>
                        <span class="text">Followers</span>
                    </div>
                    <div class="avatars">
                        <img src="assets/3.png" alt="avatar">
                        <img src="assets/4.png" alt="avatar">
                        <img src="assets/5.png" alt="avatar">
                        <img src="assets/6.png" alt="avatar">
                        <img src="assets/7.png" alt="avatar">
                    </div>
                </div>
            </div>
            <div class="content__right">
                <div class="feed__card">
                    <div class="feed">
                        <img src="assets/2.png" alt="profile">
                        <div class="feed__contetnt">
                            <h5>What an amazing day. I love being a doctor!</h5>
                            <div class="social__icons">
                                <div class="icon"><i class="ri-heart-3-fill"></i>12</div>
                                <div class="icon"><i class="ri-time-line"></i>1h ago</div>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="feed">
                        <img src="assets/2.png" alt="profile">
                        <div class="feed__contetnt">
                            <h5>What an amazing day. I love being a doctor!</h5>
                            <div class="social__icons">
                                <div class="icon"><i class="ri-heart-3-fill"></i>12</div>
                                <div class="icon"><i class="ri-time-line"></i>1h ago</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
